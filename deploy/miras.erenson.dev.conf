server {
    listen 80;
    listen [::]:80;
    server_name miras.erenson.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name miras.erenson.dev;

    ssl_certificate /etc/nginx/ssl/erenson.dev/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/erenson.dev/key.pem;
    include snippets/security-headers.conf;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/miras.erenson.dev/current;
    index index.html;

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location ^~ /_next/static/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /robots.txt { expires -1; try_files $uri =404; }
    location = /sitemap.xml { expires -1; try_files $uri =404; }
    location = /manifest.webmanifest { expires 1d; try_files $uri =404; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
